apiVersion: v1
kind: ConfigMap
metadata:
  name: secure-web-content
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Дромашко Кирилл</title></head>
    <body>
      <h1>Привет от Nginx</h1>
      <p>Привет Нетологии</p>
    </body>
    </html>
  default.conf: |
    server {
        listen 443 ssl;
        server_name mysecureapp.example.com;
        
        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        
        root /usr/share/nginx/html;
        index index.html;
        
        location / {
            try_files $uri $uri/ =404;
        }
    }

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-app
  template:
    metadata:
      labels:
        app: secure-app
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 443
        volumeMounts:
        - name: web-content
          mountPath: /usr/share/nginx/html
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: certs
          mountPath: /etc/nginx/certs
          readOnly: true
      volumes:
      - name: web-content
        configMap:
          name: secure-web-content
          items:
          - key: index.html
            path: index.html
      - name: nginx-config
        configMap:
          name: secure-web-content
          items:
          - key: default.conf
            path: default.conf
      - name: certs
        secret:
          secretName: ssl-certificate

---

apiVersion: v1
kind: Service
metadata:
  name: secure-service
spec:
  selector:
    app: secure-app
  ports:
    - protocol: TCP
      port: 443
      targetPort: 443

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secure-ingress
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  tls:
  - hosts:
    - mysecureapp.example.com
    secretName: ssl-certificate
  rules:
  - host: mysecureapp.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: secure-service
            port:
              number: 443